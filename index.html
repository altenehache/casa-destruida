<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<title>Casa Destruida</title>

}
</style></head><body>

 </div>
</div>

  funk: { k: [0, 6, 10], s: [4, 12], h: [0, 2, 4, 6, 8, 10, 12, 14] }, carnival: { k: [0, 8], s: [4, 12], h: [2, 6, 10, 14], fill: 1 },

/* ===================== JEFES (IA) ===================== */
const BA = {};

/* ---------- Bobli ---------- */
BA.bobli = {

    const p = G.p; b.t++; look(b);

    } else if (b.st === 'wind') {

/* ---------- Locki ---------- */

/* ---------- Later ---------- */

  if (open) for (let i = 0; i < 4; i++) { const a = t * .05 + i * 1.57; c.strokeStyle = 'rgba(255,255,255,.7)'; c.lineWidth = 2; c.beginPath(); c.arc(x, y - 36, 8 + i * 5, a, a + 1.2); c.stroke(); }
  c.restore();
  if (!open) { fillRR(c, x - 10, y - 46, 20, 16, 4, '#ffd23c', OL, 1.6); c.strokeStyle = OL; c.lineWidth = 3; c.beginPath(); c.arc(x, y - 48, 7, Math.PI, 0); c.stroke(); }
  fillRR(c, x - 42, y + 12, 84, 20, 8, 'rgba(60,40,90,.85)', 'rgba(255,255,255,.6)', 1.5);

  const n = w === 6 ? (S.pieces[6][8] ? 1 : 0) : worldPieces(w), mx = w === 6 ? 1 : 9;
  txt(c, done ? '★ ' + n + '/' + mx : n + '/' + mx, x, y + 46, 13, done ? '#ffe14d' : '#fff', 'center', 'rgba(40,20,70,.8)');
}
function interactHub() {
  const p = G.p; if (G.mf) return;

    if (portalOpen(po.w)) { G.hubRet = { x: po.x, y: po.y + 80 }; SFX.door(); changeMode('card', () => startWorld(po.w)); return; }
    if (G.hubWarn <= 0) { toast('Cerrado: vence al jefe del mundo anterior', 110); G.hubWarn = 90; SFX.hurt(); }
  }
  if (dist(p.x, p.y, LUNA.dx, LUNA.dy) < 30 && p.h < 30) { G.hubRet = { x: LUNA.dx - 50, y: LUNA.dy + 40 }; SFX.door(); changeMode('shop', () => { G.shopOut = outfitIndex(); G.shopHero = G.hero; }); }
}

}

  c.save(); c.beginPath(); c.arc(46, 43, 22, 0, 6.3); c.clip(); drawHero(c, G.hero, 46, 66, 0, 0, outfitOf(H.id), 1, .9); c.restore();
  txt(c, H.name, 78, 38, 17, '#fff', 'left', 'rgba(40,20,70,.8)'); txt(c, 'Q/E: cambiar · B: bestiario', 78, 60, 12, '#c8b8e8', 'left');
  txt(c, 'Entra a un portal para jugar un mundo · La luna es la tienda de ropa', VW / 2, VH - 14, 15, '#fff', 'center', 'rgba(40,20,70,.85)');

/* ---------- tienda (la luna) ---------- */
const outfitIndex = () => Math.max(0, OUTFITS.findIndex(o => o.id === outfitOf(HEROES[G.hero].id)));
G.shopOut = 0; G.shopHero = 0;
function updShop() {
  G.t++;
  const hi = G.shopHero;
  if (lfP()) { G.shopHero = (hi + 6) % 7; G.shopOut = Math.max(0, OUTFITS.findIndex(o => o.id === outfitOf(HEROES[G.shopHero].id))); SFX.move(); }
  if (rtP()) { G.shopHero = (hi + 1) % 7; G.shopOut = Math.max(0, OUTFITS.findIndex(o => o.id === outfitOf(HEROES[G.shopHero].id))); SFX.move(); }

  }

}

  txt(c, '← → héroe', 30, 146, 12, '#fff', 'left');
  // escenario
  ell(c, 260, 470, 130, 30, 'rgba(255,255,255,.2)'); ell(c, 260, 462, 120, 26, '#c8a0e8', OL, 2); ell(c, 260, 456, 110, 22, '#e8c8ff');
  const dir = [0, 3, 1, 2][Math.floor(t / 70) % 4];
  c.save(); if (!ok || !ounl) c.filter = 'brightness(.55)'; drawHero(c, hi, 260, 460, dir, 0, o.id, 1, 3.4); c.filter = 'none'; c.restore();
  if (!ounl) { txt(c, '🔒', 260, 330, 40, '#fff', 'center'); }
  glossPanel(c, 60, 150 + 0, 0, 0, 0, '#000', 0);
  txt(c, ok ? H.name : '???', 260, 196, 24, '#fff', 'center', 'rgba(40,20,70,.8)');
  // lista de atuendos
  glossPanel(c, 520, 70, 420, 424, 20, 'rgba(60,40,90,.8)');
  OUTFITS.forEach((q, i) => {
    const y = 104 + i * 38, sel = i === G.shopOut, un = q.un(), worn = outfitOf(H.id) === q.id;
    if (sel) glossPanel(c, 530, y - 22, 400, 34, 12, 'rgba(255,127,184,.9)');
    c.globalAlpha = un ? 1 : .45; txt(c, q.name, 548, y, 18, '#fff', 'left', 'rgba(40,20,70,.7)');
    txt(c, worn ? '✓ puesto' : un ? 'Disponible' : '🔒 ' + q.req, 918, y, un ? 14 : 12, worn ? '#9affb0' : '#ffe9a0', 'right'); c.globalAlpha = 1;
  });
  txt(c, '↑ ↓ atuendo · Enter ponerse · Esc volver al mapa', 480, 520, 15, '#fff', 'center', 'rgba(40,20,70,.8)');
  if (G.banner) { glossPanel(c, 280, 470, 400, 36, 16, 'rgba(0,0,0,.7)'); txt(c, G.banner.s, 480, 495, 16, '#fff', 'center'); }
}

/* ---------- mundo: carta y arranque ---------- */
function startWorld(w) {
  G.w = w; G.W = buildWorld(w); G.a = G.W.areas.main; G.hero = w; G.p = newPlayer(G.a.spawn.x, G.a.spawn.y);
  G.unBefore = OUTFITS.filter(o => o.id !== 'none' && o.un()).map(o => o.id);

  G.zoneIdx = -1; G.trans = null; G.paused = false; G.hub = null; G.a.flags[0].on = true; G.cardT = 0; G.black = 0; G.t = 0;
  G.cam = camTarget(); G.mode = 'card';
}
function updCard() { G.cardT++; G.t++; if (G.cardT > 40 && (actP() || G.cardT > 200)) { G.mode = 'play'; G.t = 0; SFX.ok(); } }
function drawCard(c) {

  c.restore();
  txt(c, w === 6 ? 'Aquí hacen falta TODOS los héroes: cambia con Q / E' : (w > 0 ? `Puedes cambiar de héroe con Q / E (tienes ${availList().length})` : 'Salta con Espacio · Habilidad con Z'), 480, 440, 18, '#fff', 'center', T.face2);
  if (t > 40) txt(c, 'Enter para empezar', 480, 490, 18, '#fff', 'center', T.face2);
}

/* ---------- jugar ---------- */
function updPlay() {
  if (G.paused) {
    if (upP() || dnP()) { G.pauseSel = (G.pauseSel + (upP() ? 2 : 1)) % 3; SFX.move(); }
    if (actP()) { SFX.ok(); if (G.pauseSel === 0) G.paused = false; else if (G.pauseSel === 1) { muted = !muted; } else { G.paused = false; changeMode('hub', enterHub); } }
    if (pressed.Escape || pressed.KeyP) G.paused = false;
    return;
  }
  updateLevel();
}
function drawPlayMode(c) {
  drawLevel(c); drawHUD(c);
  if (G.black > 0) { c.fillStyle = `rgba(0,0,0,${G.black})`; c.fillRect(0, 0, VW, VH); }

    c.fillStyle = 'rgba(20,10,40,.6)'; c.fillRect(0, 0, VW, VH);
    glossPanel(c, 300, 150, 360, 240, 22, 'rgba(60,40,90,.92)');
    txt(c, 'Pausa', 480, 200, 32, '#fff', 'center');
    ['Continuar', muted ? 'Sonido: apagado' : 'Sonido: encendido', 'Volver al mapa central'].forEach((s, i) => { const on = i === G.pauseSel; if (on) glossPanel(c, 320, 226 + i * 42, 320, 36, 14, 'rgba(255,127,184,.95)'); txt(c, s, 480, 252 + i * 42, 19, '#fff', 'center'); });
  }
}

/* ---------- mundo completado ---------- */
function updClear() {
  G.clear.t++; G.t++; updateParts();
  if (G.clear.t % 8 === 0 && G.clear.t < 200) burst(rand(200, 760), rand(100, 300), THEMES[G.clear.w].accent, 14, 4, 40);
  if (G.clear.t > 60 && actP()) { SFX.ok(); changeMode('hub', enterHub); }
}
function drawClear(c) {
  const k = G.clear, w = k.w, T = THEMES[w];
  c.fillStyle = lgrad(c, 0, 0, 0, VH, [[0, T.sky[0]], [.6, T.sky[1]], [1, T.sky[2]]]); c.fillRect(0, 0, VW, VH);
  drawAmbient(c, w, G.t);
  G.parts.forEach(q => { circ(c, q.x, q.y - q.h * ZF, q.s, q.c); });
  txt(c, '¡MUNDO COMPLETADO!', 480, 90, 52, '#fff', 'center', T.face2);

  glossPanel(c, 160, 150, 640, 290, 24, 'rgba(255,255,255,.4)');

  txt(c, `¡Pieza del jefe conseguida!`, 400, y, 22, '#fff', 'left', T.face2); y += 34;
  txt(c, w === 6 ? 'Pieza gigante del castillo' : `Piezas de este mundo: ${worldPieces(w)} / 9`, 400, y, 19, '#fff', 'left', T.face2); y += 32;
  txt(c, `Total del castillo: ${totalPieces()} / 55`, 400, y, 19, '#fff', 'left', T.face2); y += 32;
  txt(c, `${HEROES[w].name} ya puede jugar en otros mundos.`, 400, y, 17, '#fff', 'left', T.face2); y += 30;
  if (w < 6) txt(c, `Se abrió el portal: ${WORLDS[w + 1].n}`, 400, y, 17, '#fff', 'left', T.face2); y += 30;
  k.gained.forEach(o => { txt(c, `Atuendo nuevo en la luna: ${o.name}`, 400, y, 17, '#ffe14d', 'left', T.face2); y += 26; });
  if (k.missing.length) txt(c, `Te faltan ${k.missing.length} piezas sueltas: puedes volver a buscarlas.`, 400, y, 15, '#fff', 'left', T.face2);

/* ---------- final ---------- */
G.et = 0;
function updEnding() {
  G.et++; G.t++; updateParts();
  if (G.et > 330 && G.et % 18 === 0) burst(rand(120, 840), rand(60, 260), THEMES[Math.floor(rand(0, 7))].accent, 26, 5, 80);
  if (G.et === 330) SFX.piece();
  if (G.et > 120 && actP() && G.et > 500) { S.endSeen = true; persist(); G.hubRet = null; changeMode('hub', () => { G.mode = 'hub'; enterHubAfterEnd(); }); }
}
function enterHubAfterEnd() { S.endSeen = true; enterHub(); G.mode = 'hub'; }
function drawEnding(c) {
  const t = G.et, cw = 38, ch = 25, x0 = 480 - 11 * cw / 2, y0 = 130;
  bgSoft(c, '#ff9ad0', '#ffe0a8', '#bfe8ff');
  drawAmbient(c, 4, G.t);

  const n = Math.min(55, Math.floor(t / 5)), done = n >= 55;
  drawCastle(c, x0, y0, cw, ch, n, t, done, true);
  if (!done && t % 5 === 0) SFX.move();
  G.parts.forEach(q => { c.globalAlpha = Math.min(1, q.l / 20); circ(c, q.x, q.y - q.h * ZF, q.s, q.c); c.globalAlpha = 1; });
  if (t > 300) HEROES.forEach((h, i) => { const k = Math.min(1, (t - 300 - i * 6) / 20); c.globalAlpha = k; drawHero(c, i, 100 + i * 127, 520 - Math.abs(Math.sin(t * .1 + i)) * 14, 0, Math.floor(t / 8) % 4, outfitOf(h.id), 1, 1.3); c.globalAlpha = 1; });
  drawPoto(c, 480, 440, 1.3, t, 'run');
  if (t > 330) { glossPanel(c, 140, 20, 680, 84, 22, 'rgba(60,40,90,.85)'); txt(c, '¡LO LOGRARON!', 480, 62, 36, '#ffe14d', 'center', '#7a2a68'); txt(c, 'El castillo de muñecos con orejas de gato está reconstruido.', 480, 90, 18, '#fff', 'center'); }
  if (t > 520) { txt(c, 'Idea y personajes: Mart · Diseño y juego: su papá y Claude', 480, VH - 56, 17, '#7a2a68', 'center', '#fff'); txt(c, 'Enter para seguir jugando', 480, VH - 30, 17, '#7a2a68', 'center', '#fff'); }
}

/* ===================== BUCLE ===================== */
function currentUpdate() {
  switch (G.mode) {
    case 'title': return updTitle(); case 'controls': return updControls(); case 'bestiary': return updBestiary(); case 'intro': return updIntro();
    case 'hub': return updHub(); case 'shop': return updShop(); case 'card': return updCard(); case 'play': return updPlay(); case 'clear': return updClear(); case 'ending': return updEnding();
  }
}
function currentDraw(c) {
  switch (G.mode) {
    case 'title': return drawTitle(c); case 'controls': return drawControls(c); case 'bestiary': return drawBestiary(c); case 'intro': return drawIntro(c);
    case 'hub': return drawHub(c); case 'shop': return drawShop(c); case 'card': return drawCard(c); case 'play': return drawPlayMode(c); case 'clear': return drawClear(c); case 'ending': return drawEnding(c);
  }
}
function tickOnce() {
  pollPad();
  if (G.mf) {
    G.mf.t++; if (G.mf.t === 14) applyMode(); if (G.mf.t >= 28) G.mf = null;
  } else currentUpdate();
  if (G.banner && !['hub', 'play', 'shop', 'title'].includes(G.mode)) G.banner = null;
  if (pressed.KeyM) muted = !muted;
  for (const k in pressed) { ensureAC(); break; }
  musicTick();
  for (const k in pressed) delete pressed[k];
}
function drawFrame() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, VW, VH);
  currentDraw(ctx);
  if (G.mf) { const a = G.mf.t < 14 ? G.mf.t / 14 : 1 - (G.mf.t - 14) / 14; ctx.fillStyle = `rgba(10,5,25,${clamp(a, 0, 1)})`; ctx.fillRect(0, 0, VW, VH); }
  if (padOn) txt(ctx, '🎮', 22, VH - 10, 14, '#fff', 'left');
  if (muted) txt(ctx, '🔇', VW - 24, VH - 10, 14, '#fff', 'center');
}
let _last = 0, _acc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min(100, ts - _last); _last = ts; _acc += dt;
  let n = 0; while (_acc >= 16.667 && n < 4) { tickOnce(); _acc -= 16.667; n++; }
  if (n === 4) _acc = 0;
  drawFrame();
}
function startGame() {
  cv.width = VW; cv.height = VH;
  if (S.hubHero == null) S.hubHero = 0;
  G.mode = 'title';
  requestAnimationFrame(loop);
}

startGame();
